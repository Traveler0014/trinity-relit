name: Check and Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 只授予发布 Pages 所需的最小权限
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 章节规范校验
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 无运行时依赖，不需要 npm ci
      - run: npm test
      - run: npm run verify
      # verify:exits 需要 scripts/exit_truth.json，它派生自受版权保护的
      # TRINITY.DAT 因而不入库，只能本地运行。见 SHIP_PLAN.md 阶段 0.5。

  deploy:
    name: 部署到 GitHub Pages
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      # prototype/ 是纯静态 ES module，无构建步骤
      - uses: actions/upload-pages-artifact@v3
        with:
          path: prototype
      - id: deployment
        uses: actions/deploy-pages@v4
