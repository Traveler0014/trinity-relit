<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Trinity Relit · 中文版</title>
<meta name="description" content="让 Infocom 的 Trinity (1986) 重新可玩。中英双语文字冒险，语义匹配完全在浏览器本地运行，无需服务器或 API Key。">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Palette shared with klarachen.com: warm amber on near-black, not GitHub dark. */
:root {
  --bg: #0b0b0a;
  --bg-raised: #121211;
  --border: #222220;
  --text: #c9b97c;
  --dim: #7a7260;
  --faint: #55503f;
  --bright: #e8e2d4;
  --amber: #c9b97c;
  --mono: "IBM Plex Mono", "SF Mono", "Menlo", "Monaco", "Consolas", monospace;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--mono);
  font-size: 15px;
  line-height: 1.8;
  height: 100vh;
  /* 移动端浏览器的地址栏会吃掉 100vh 的一部分 */
  height: 100dvh;
  display: flex;
  flex-direction: column;
}

#header {
  padding: 12px 20px;
  background: var(--bg-raised);
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
}

#header h1 {
  font-size: 15px;
  font-weight: 500;
  letter-spacing: 0.06em;
  color: var(--amber);
}

#header .subtitle {
  font-size: 12px;
  color: var(--dim);
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

.hdr-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--dim);
  padding: 4px 12px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 12px;
  font-family: inherit;
  white-space: nowrap;
  transition: border-color 0.2s, color 0.2s;
}
.hdr-btn:hover { border-color: var(--amber); color: var(--amber); }

/* 开局的「继续 / 重开」选择 */
.resume-prompt {
  margin: 12px 0;
  padding: 12px 14px;
  background: rgba(201, 185, 124, 0.07);
  border: 1px solid var(--border);
  border-left: 2px solid var(--amber);
  border-radius: 0 4px 4px 0;
}

.resume-summary { color: var(--bright); margin-bottom: 10px; }
.resume-chosen  { color: var(--dim); font-style: italic; }

.resume-actions { display: flex; gap: 10px; flex-wrap: wrap; }

.btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--bright);
  padding: 7px 16px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 14px;
  font-family: inherit;
  transition: border-color 0.2s, background 0.2s, color 0.2s;
}
.btn:hover { border-color: var(--amber); }

/* 主按钮在这套配色里是实心琥珀配深字，取代原来的实心蓝配白字 */
.btn-primary {
  background: var(--amber);
  border-color: var(--amber);
  color: var(--bg);
  font-weight: 500;
}
.btn-primary:hover { background: var(--bright); border-color: var(--bright); }

#output {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  scroll-behavior: smooth;
}

.location {
  color: var(--amber);
  font-weight: 500;
  font-size: 15px;
  letter-spacing: 0.04em;
  margin: 24px 0 10px 0;
  padding: 6px 12px;
  background: rgba(201, 185, 124, 0.07);
  border-left: 2px solid var(--amber);
  border-radius: 0 4px 4px 0;
}
.location:first-child { margin-top: 0; }

.scene-text {
  color: var(--text);
  margin: 10px 0;
  white-space: pre-wrap;
}

/* 原文亮，译文暗 —— 和站点上引用这段文字时的层次一致 */
.scene-text.lang-en { color: var(--text); }
.scene-text.lang-zh { color: var(--dim); }
.scene-text.lang-zh + .scene-text.lang-en { margin-top: 18px; }

.user-input {
  color: var(--bright);
  margin: 14px 0 4px 0;
}
.user-input::before { content: ">> "; color: var(--amber); opacity: 0.7; }

.system-msg {
  color: var(--dim);
  font-style: italic;
  margin: 4px 0;
}

.debug-info {
  font-size: 12px;
  color: var(--faint);
  margin: 2px 0 8px 0;
  padding: 4px 8px;
  background: rgba(201, 185, 124, 0.05);
  border-radius: 4px;
  display: none;
}
.debug-info.visible { display: block; }

.item-gained {
  color: var(--bright);
  font-weight: 500;
}

#input-area {
  padding: 12px 20px;
  background: var(--bg-raised);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

#input-area .prompt {
  color: var(--amber);
  font-weight: 500;
  font-size: 15px;
  flex-shrink: 0;
}

#input-area input {
  flex: 1;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--bright);
  padding: 8px 12px;
  border-radius: 4px;
  font-family: inherit;
  /* 小于 16px 时 iOS Safari 会在聚焦输入框时自动放大整个页面 */
  font-size: 16px;
  outline: none;
  transition: border-color 0.2s;
}
#input-area input::placeholder { color: var(--faint); }
#input-area input:focus { border-color: var(--amber); }
#input-area input:disabled { opacity: 0.4; }

#loading {
  position: fixed;
  inset: 0;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 100;
  gap: 16px;
}

#loading h2 {
  color: var(--amber);
  font-size: 18px;
  font-weight: 500;
  letter-spacing: 0.06em;
}

#loading .status {
  color: var(--dim);
  font-size: 14px;
  min-height: 20px;
}

#loading .progress-bar {
  width: min(300px, 78vw);
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}

#loading .progress-fill {
  height: 100%;
  background: var(--amber);
  border-radius: 2px;
  transition: width 0.3s;
  width: 0%;
}

.inventory-display {
  color: var(--bright);
  margin: 4px 0;
  padding: 4px 0;
}

#loading .note {
  color: var(--faint);
  font-size: 12px;
  max-width: min(360px, 82vw);
  text-align: center;
  line-height: 1.6;
}

@media (max-width: 600px) {
  /* 四个按钮在窄屏放不下一行。让整个头部换行，标题独占一行，
     否则按钮会把标题挤成断开的两截。 */
  #header { padding: 10px 14px; gap: 8px; flex-wrap: wrap; }
  #header .subtitle { display: none; }
  #header h1 { white-space: nowrap; }
  .header-actions { gap: 6px; flex: 1; }
  .hdr-btn { padding: 4px 8px; font-size: 11px; }
  #output { padding: 14px; }
  #input-area { padding: 10px 14px; }
  /* 留出 iPhone 底部小横条的空间 */
  #input-area { padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
}
</style>
</head>
<body>

<div id="header">
  <div>
    <h1>Trinity · 中文版</h1>
    <span class="subtitle">完全浏览器端推理</span>
  </div>
  <div class="header-actions">
    <button id="btn-export" class="hdr-btn" title="把当前进度导出为 JSON 文件">导出存档</button>
    <button id="btn-import" class="hdr-btn" title="从 JSON 文件读取进度，会覆盖当前存档">导入存档</button>
    <button id="btn-restart" class="hdr-btn" title="清除存档，从头开始">重新开始</button>
    <button id="debug-toggle" class="hdr-btn" onclick="toggleDebug()">调试面板: 关</button>
  </div>
</div>

<!-- 导入存档用。ui.pickJSONFile() 会程序化点击它。 -->
<input type="file" id="save-file-input" accept="application/json,.json" hidden>

<div id="output"></div>

<div id="input-area">
  <span class="prompt">&gt;&gt;</span>
  <input type="text" id="input" placeholder="输入中文或英文指令..." disabled autocomplete="off">
</div>

<div id="loading">
  <h2>Trinity Relit · 中文版</h2>
  <div class="status" id="loading-status">正在初始化...</div>
  <div class="progress-bar">
    <div class="progress-fill" id="loading-progress"></div>
  </div>
  <p class="note">游戏完全在本地运行，无需服务器与 API Key。</p>
</div>

<script>
let debugVisible = false;
function toggleDebug() {
  debugVisible = !debugVisible;
  document.getElementById('debug-toggle').textContent = `调试面板: ${debugVisible ? '开' : '关'}`;
  document.querySelectorAll('.debug-info').forEach(el => {
    el.classList.toggle('visible', debugVisible);
  });
}
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
